name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  engine:
    name: Python engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Same pandas version as Pyodide 0.27.7, which runs the engine in the browser
      - run: pip install pandas==2.2.3 openpyxl==3.1.5 pypdf==6.18.1 cryptography pytest==8.3.5
      - run: python -m pytest tests/engine -q
